name: Notion Backup

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = KST 03:00
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: '모든 페이지를 다시 렌더링(변환 규칙을 바꾼 뒤)'
        type: boolean
        default: false
      allow_mass_delete:
        description: '대량 삭제 차단의 수량 제한 해제(의도한 대량 삭제)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: notion-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. 작업 시작 시각 기록, 실행 조건 확인(명세서 8.4절)
      #    예약 실행의 이벤트 정보에는 저장소 정보가 없을 수 있으므로 API로 조회한다.
      #    - 템플릿 저장소(코드 배포용): 백업하지 않고 성공으로 끝낸다.
      #    - Public이거나 공개 여부를 알 수 없음: 백업하지 않고 실패로 끝낸다.
      #    - NOTION_TOKEN이 아직 없음: 예약 실행은 건너뛰고(설정 전 실패 메일 방지), 수동 실행은 실패로 알린다.
      - name: 작업 시작 시각 기록, 실행 조건 확인
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_TOKEN: ${{ secrets.NOTION_TOKEN != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          info="$(gh api "repos/${{ github.repository }}" --jq '"\(.private) \(.is_template)"' 2>/dev/null || true)"
          private="${info% *}"
          template="${info#* }"
          if [ "$template" = "true" ]; then
            echo "## 템플릿 저장소라 백업하지 않음" >> "$GITHUB_STEP_SUMMARY"
            echo "Use this template으로 내 Private 저장소를 만든 뒤 그 저장소에서 실행하세요." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$private" != "true" ]; then
            {
              echo "## 백업하지 않음"
              echo
              echo "공개 저장소이거나 공개 여부를 확인할 수 없어 백업하지 않았습니다. 저장소를 Private으로 바꾼 뒤 다시 실행하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "## NOTION_TOKEN이 없어 백업하지 않음" >> "$GITHUB_STEP_SUMMARY"
            echo "저장소 Settings → Secrets and variables → Actions에 NOTION_TOKEN을 등록하세요." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
            if [ "$EVENT" = "schedule" ]; then
              exit 0
            fi
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # 2. 저장소 체크아웃(외부 Action은 커밋 SHA로 고정, 주석은 버전)
      - if: steps.check.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 3. Python 3.14와 패키지 설치
      - if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      # 4. 백업. 결과(ok/partial/abort)는 outputs.result에 적고 항상 종료 코드 0으로 끝난다.
      - name: 백업
        id: backup
        if: steps.check.outputs.run == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FULL_REBUILD: ${{ inputs.full_rebuild }}
          ALLOW_MASS_DELETE: ${{ inputs.allow_mass_delete }}
        run: python backup.py

      # 5. 결과가 ok나 partial이고 변경이 있으면 커밋하고 push
      - name: 커밋과 push
        if: always() && steps.check.outputs.run == 'true' && (steps.backup.outputs.result == 'ok' || steps.backup.outputs.result == 'partial')
        env:
          MESSAGE: ${{ steps.backup.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "$MESSAGE"
          if ! git push; then
            git pull --rebase
            git push
          fi

      # 6~7. 결과가 ok가 아니면 실패로 표시(Summary는 backup.py가 이미 남겼다)
      - name: 결과 확인
        if: always() && steps.check.outputs.run == 'true'
        env:
          RESULT: ${{ steps.backup.outputs.result }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "## backup.py가 예외로 중단되어 커밋하지 않았습니다" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$RESULT" != "ok" ]; then
            echo "결과: $RESULT"
            exit 1
          fi
